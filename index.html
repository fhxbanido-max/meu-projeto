<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versículo do Dia</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Georgia, serif;
      overflow: hidden;
      background: #000;
    }

    /* Duas camadas de imagem para fazer o crossfade suave */
    .fundo {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1s ease;
      transform: scale(1.05);
    }
    .fundo.visivel {
      opacity: 1;
      animation: zoomLento 20s ease-out forwards;
    }
    @keyframes zoomLento {
      from { transform: scale(1.05); }
      to   { transform: scale(1.15); }
    }
    #escurecer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
    }

    #conteudo {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 32px;
      color: #fff;
      overflow-y: auto;
    }
    #bloco-versiculo {
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #bloco-versiculo.saindo {
      opacity: 0;
      transform: translateY(15px);
    }
    #texto {
      font-size: clamp(1.6rem, 4vw, 3rem);
      line-height: 1.4;
      max-width: 900px;
      margin: 0 0 16px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    #referencia {
      font-size: clamp(1.1rem, 2vw, 1.6rem);
      font-weight: bold;
      margin: 0 0 32px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }

    button {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.6);
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
      margin: 6px;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.2s;
    }
    button:hover { background: rgba(255,255,255,0.35); transform: translateY(-2px); }
    button:active { transform: scale(0.96); }
    .controles-audio {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 14px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 12px;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(4px);
    }
    .controles-audio label {
      display: flex;
      align-items: center;
      gap: 6px;
      font: 0.95rem Arial, sans-serif;
    }
    .controles-audio select,
    .controles-audio input {
      max-width: 180px;
      accent-color: #d7b778;
    }
    .controles-audio select {
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 6px;
      color: #fff;
      background: #282828;
    }
    .controles-audio input[type="range"] { width: 100px; }
    #btn-abrir-favoritos {
      position: fixed;
      top: 16px;
      right: 16px;
      margin: 0;
      z-index: 5;
    }

    #aviso {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 20;
    }
    #aviso.mostrar {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #painel {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      max-width: 90%;
      height: 100%;
      background: #fff;
      color: #333;
      padding: 20px;
      overflow-y: auto;
      box-shadow: -4px 0 16px rgba(0,0,0,0.3);
      transition: right 0.35s ease;
      z-index: 10;
    }
    #painel.aberto { right: 0; }
    #painel h2 { margin-top: 0; }
    #painel button {
      background: #7a5c2e;
      border: none;
      margin: 0;
    }
    #lista-favoritos { list-style: none; padding: 0; }
    #lista-favoritos li {
      background: #f4efe6;
      margin-bottom: 10px;
      padding: 14px;
      border-radius: 8px;
      animation: entrar 0.3s ease;
    }
    @keyframes entrar {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    #lista-favoritos small { display: block; color: #7a5c2e; font-weight: bold; margin-top: 6px; }
    .remover { background: #b04a3a !important; padding: 4px 10px; font-size: 0.8rem; margin-top: 8px !important; }
  </style>
</head>
<body>

          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
        </select>
      </label>
      <button id="btn-ouvir" type="button">🔊 Ouvir</button>
      <label for="voz"><span id="rotulo-voz">Voz</span>
        <select id="voz"><option value="">Automática</option></select>
      </label>
      <label for="velocidade"><span id="rotulo-velocidade">Velocidade</span>
        <input id="velocidade" type="range" min="0.6" max="1.6" step="0.1" value="1">
        <output id="velocidade-valor" for="velocidade">1×</output>
      </label>
    </div>
  </div>

  <div id="painel">
    <button id="btn-fechar">Fechar ✕</button>

    <ul id="lista-favoritos"></ul>

    const elIdioma = document.getElementById("idioma");
    const elVoz = document.getElementById("voz");

    const elVelocidadeValor = document.getElementById("velocidade-valor");
    const elBtnOuvir = document.getElementById("btn-ouvir");
    const fundos = [document.getElementById("fundo1"), document.getElementById("fundo2")];
    let fundoAtivo = 0;
    let atual = null;
    let ocupado = false;
    let vozes = [];
    let falando = false;

    function idiomaAtual() {
      return elIdioma.value;
    }

    function textoDaChave(chave) {
      return textos[idiomaAtual()][chave];
    }

    function textoDoVersiculo(versiculo) {
      const indice = versiculos.indexOf(versiculo);
      return idiomaAtual() === "pt" ? versiculo.texto : (traducoes[idiomaAtual()][indice] || versiculo.texto);
    }

    function referenciaDoVersiculo(versiculo) {
      if (idiomaAtual() === "pt") return versiculo.referencia;
      const partes = versiculo.referencia.match(/^(.+?)\s+(.+)$/);
      if (!partes) return versiculo.referencia;
      const livro = nomesLivros[idiomaAtual()][partes[1]] || partes[1];
      return livro + " " + partes[2];
    }

    function avisar(mensagem) {
      elAviso.textContent = mensagem;
      elAviso.classList.add("mostrar");
      setTimeout(() => elAviso.classList.remove("mostrar"), 2000);
    }

    function trocarFundo(url) {
      const proximo = 1 - fundoAtivo;
      const novo = fundos[proximo];
      const velho = fundos[fundoAtivo];
      novo.style.backgroundImage = "url('" + url + "')";
      novo.classList.remove("visivel");
      void novo.offsetWidth; // reinicia a animação
      novo.classList.add("visivel");
      velho.classList.remove("visivel");
      fundoAtivo = proximo;
    }

    function escolherNovo() {
      let novo;
      do {
        novo = versiculos[Math.floor(Math.random() * versiculos.length)];
      } while (novo === atual && versiculos.length > 1);
      return novo;
    }

    function mostrar(versiculo, animar) {
      atual = versiculo;
      const aplicar = () => {
        renderizarVersiculo();
        elBloco.classList.remove("saindo");
        ocupado = false;
      };
      // Pré-carrega a imagem para a troca ficar suave
      const img = new Image();
      img.onload = img.onerror = () => {
        trocarFundo(atual.imagem);
        if (animar) setTimeout(aplicar, 500); else aplicar();
      };
      if (animar) elBloco.classList.add("saindo");
      img.src = atual.imagem;
    }

    function renderizarVersiculo() {
      if (!atual) return;
      elTexto.textContent = "“" + textoDoVersiculo(atual) + "”";
      elRef.textContent = referenciaDoVersiculo(atual);
    }

    function sortear() {
      if (ocupado) return;
      ocupado = true;
      mostrar(escolherNovo(), true);
    }

    function lerFavoritos() {
      return JSON.parse(localStorage.getItem("favoritos") || "[]");
    }

    function salvarFavoritos(lista) {
      localStorage.setItem("favoritos", JSON.stringify(lista));
    }

    function mostrarFavoritos() {
      const favoritos = lerFavoritos();
      elLista.innerHTML = "";
      if (favoritos.length === 0) {
        const vazio = document.createElement("li");
        vazio.textContent = textoDaChave("empty");
        elLista.appendChild(vazio);
        return;
      }
      favoritos.forEach((v, i) => {
        const li = document.createElement("li");
        const texto = document.createElement("span");
        texto.textContent = "“" + textoDoVersiculo(v) + "”";
        const referencia = document.createElement("small");
        referencia.textContent = referenciaDoVersiculo(v);
        li.append(texto, referencia);
        const btn = document.createElement("button");
        btn.textContent = textoDaChave("remove");
        btn.className = "remover";
        btn.onclick = () => {
          const lista = lerFavoritos();
          lista.splice(i, 1);
          salvarFavoritos(lista);
          mostrarFavoritos();
        };
        li.appendChild(btn);
        elLista.appendChild(li);
      });
    }

    function pararLeitura() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      falando = false;
      elBtnOuvir.textContent = textoDaChave("listen");
    }

    function atualizarVozes() {
      if (!("speechSynthesis" in window)) return;
      vozes = window.speechSynthesis.getVoices();
      const selecionada = elVoz.value;
      const prefixo = idiomasVoz[idiomaAtual()];
      const compativeis = vozes.filter(v => v.lang.toLowerCase().startsWith(prefixo));
      const lista = compativeis.length ? compativeis : vozes;
      elVoz.replaceChildren();
      const automatica = document.createElement("option");
      automatica.value = "";
      automatica.textContent = textoDaChave("automatic");
      elVoz.appendChild(automatica);
      lista.forEach(voz => {
        const opcao = document.createElement("option");
        opcao.value = voz.voiceURI;
        opcao.textContent = voz.name + " (" + voz.lang + ")";
        elVoz.appendChild(opcao);
      });
      if (lista.some(v => v.voiceURI === selecionada)) elVoz.value = selecionada;
    }

    function ouvirVersiculo() {
      if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
        avisar(textoDaChave("speechUnsupported"));
        return;
      }
      if (falando) {
        pararLeitura();
        return;
      }
      const fala = new SpeechSynthesisUtterance(textoDoVersiculo(atual) + ". " + referenciaDoVersiculo(atual));
      fala.lang = idiomaAtual() === "pt" ? "pt-BR" : idiomaAtual();
      fala.rate = Number(elVelocidade.value);
      fala.voice = vozes.find(v => v.voiceURI === elVoz.value) || null;
      fala.onend = () => {
        falando = false;
        elBtnOuvir.textContent = textoDaChave("listen");
      };
      fala.onerror = evento => {
        falando = false;
        elBtnOuvir.textContent = textoDaChave("listen");
        if (evento.error !== "canceled") avisar(textoDaChave("speechUnsupported"));
      };
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(fala);
      falando = true;
      elBtnOuvir.textContent = textoDaChave("stop");
    }

    function atualizarInterface() {
      const idioma = idiomaAtual();
      const textosInterface = textos[idioma];
      document.documentElement.lang = idioma === "pt" ? "pt-BR" : idioma;
      document.title = textosInterface.title;
      document.getElementById("btn-abrir-favoritos").textContent = textosInterface.favorites;
      document.getElementById("btn-novo").textContent = textosInterface.newVerse;
      document.getElementById("btn-favoritar").textContent = textosInterface.favorite;
      document.getElementById("btn-compartilhar").textContent = textosInterface.share;
      document.getElementById("rotulo-idioma").textContent = textosInterface.language;
      document.getElementById("painel-titulo").textContent = textosInterface.favoritesTitle;
      document.getElementById("btn-fechar").textContent = textosInterface.close;
      document.getElementById("rotulo-voz").textContent = textosInterface.voice;
      document.getElementById("rotulo-velocidade").textContent = textosInterface.speed;
      pararLeitura();
      atualizarVozes();
      renderizarVersiculo();
      mostrarFavoritos();
    }

    document.getElementById("btn-novo").onclick = sortear;

    document.getElementById("btn-favoritar").onclick = () => {
      const lista = lerFavoritos();
      if (lista.some(v => v.referencia === atual.referencia)) {
        avisar(textoDaChave("alreadyFavorite"));
        return;
      }
      lista.push(atual);
      salvarFavoritos(lista);
      mostrarFavoritos();
      avisar(textoDaChave("added"));
    };

    document.getElementById("btn-compartilhar").onclick = () => {
      const mensagem = "“" + textoDoVersiculo(atual) + "” — " + referenciaDoVersiculo(atual);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(mensagem).then(
          () => avisar(textoDaChave("copied")),
          () => avisar(textoDaChave("copyFailed"))
        );
      } else {
        avisar(textoDaChave("copyUnsupported"));
      }
    };

    document.getElementById("btn-abrir-favoritos").onclick = () => elPainel.classList.add("aberto");
    document.getElementById("btn-fechar").onclick = () => elPainel.classList.remove("aberto");
    elIdioma.onchange = atualizarInterface;
    elBtnOuvir.onclick = ouvirVersiculo;
    elVoz.onchange = pararLeitura;
    elVelocidade.oninput = () => {
      elVelocidadeValor.textContent = Number(elVelocidade.value).toLocaleString(idiomaAtual()) + "×";
    };

    // Atalhos do teclado: espaço ou seta pra direita sorteia outro
    document.addEventListener("keydown", (e) => {
      if ((e.code === "Space" || e.code === "ArrowRight") &&
          !["BUTTON", "INPUT", "SELECT"].includes(document.activeElement.tagName)) {
        e.preventDefault();
        sortear();
      }
    });

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = atualizarVozes;
    }
    atualizarInterface();
    mostrar(escolherNovo(), false);
  </script>
</body>
</html>
