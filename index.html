<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nação Rubro-Negra | Notícias do Flamengo</title>
  <style>
    :root {
      --vermelho: #c5161d;
      --vermelho-escuro: #8f0e13;
      --preto: #0b0b0d;
      --dourado: #e5b84b;
      --bg-card: rgba(18, 18, 22, 0.88);
      --bg-card-solido: #141418;
      --texto: #f5f5f7;
      --texto-sec: #b8b8c2;
      --borda: rgba(255, 255, 255, 0.14);
    }

    body.tema-claro {
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-card-solido: #ffffff;
      --texto: #16161a;
      --texto-sec: #4e4e5a;
      --borda: rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--texto);
      background: var(--preto);
    }

    /* Fundo animado com crossfade a cada 3 segundos */
    .fundo-slide {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.9s ease-in-out, transform 4s ease-out;
      transform: scale(1.03);
      z-index: -2;
    }
    .fundo-slide.ativo {
      opacity: 1;
      transform: scale(1.09);
    }
    #camada-escura {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(10, 10, 12, 0.78) 0%,
        rgba(130, 12, 18, 0.45) 45%,
        rgba(10, 10, 12, 0.9) 100%
      );
      z-index: -1;
      pointer-events: none;
    }
    body.tema-claro #camada-escura {
      background: linear-gradient(
        180deg,
        rgba(245, 245, 247, 0.82) 0%,
        rgba(255, 235, 236, 0.78) 50%,
        rgba(245, 245, 247, 0.92) 100%
      );
    }

    /* Cabeçalho */
    header {
      position: sticky;
      top: 0;
      z-index: 15;
      background: rgba(12, 12, 15, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 3px solid var(--vermelho);
      padding: 14px 20px;
      color: #fff;
    }
    .topo-container {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .marca {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .escudo-badge {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: repeating-linear-gradient(
        180deg,
        var(--vermelho) 0px,
        var(--vermelho) 7px,
        #111 7px,
        #111 14px
      );
      border: 2px solid var(--dourado);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.95rem;
      color: #fff;
      text-shadow: 0 1px 3px #000;
    }
    .marca h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }
    .marca span {
      display: block;
      font-size: 0.78rem;
      color: #d6d6de;
    }

    .acoes-topo {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.22); transform: translateY(-1px); }
    .btn-vermelho {
      background: var(--vermelho);
      border-color: var(--vermelho);
      color: #fff;
    }
    .btn-vermelho:hover { background: var(--vermelho-escuro); }

    /* Conteúdo principal */
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* Destaque Principal */
    .destaque {
      background: var(--bg-card);
      border: 1px solid var(--borda);
      border-left: 6px solid var(--vermelho);
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      margin-bottom: 26px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }
    @media (max-width: 820px) {
      .destaque { grid-template-columns: 1fr; }
    }
    .destaque-img {
      min-height: 270px;
      background-size: cover;
      background-position: center;
    }
    .destaque-corpo {
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .tag-categoria {
      display: inline-block;
      align-self: flex-start;
      background: var(--vermelho);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .destaque-corpo h2 {
      margin: 0 0 12px;
      font-size: clamp(1.4rem, 2.5vw, 1.95rem);
      line-height: 1.25;
    }
    .destaque-corpo p {
      margin: 0 0 18px;
      color: var(--texto-sec);
      line-height: 1.55;
      font-size: 0.98rem;
    }
    .meta-info {
      font-size: 0.82rem;
      color: var(--texto-sec);
      margin-bottom: 16px;
    }

    /* Barra de Filtros e Busca */
    .barra-navegacao {
      background: var(--bg-card);
      border: 1px solid var(--borda);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(8px);
    }
    .categorias {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cat-btn {
      background: transparent;
      color: var(--texto);
      border: 1px solid var(--borda);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn:hover { border-color: var(--vermelho); }
    .cat-btn.ativa {
      background: var(--vermelho);
      border-color: var(--vermelho);
      color: #fff;
    }
    .campo-busca {
      flex: 1 1 240px;
      max-width: 340px;
    }
    .campo-busca input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--borda);
      background: rgba(128, 128, 128, 0.14);
      color: var(--texto);
      font-size: 0.9rem;
      outline: none;
    }
    .campo-busca input:focus { border-color: var(--vermelho); }

    /* Grid de Notícias */
    .grid-noticias {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 20px;
    }
    .card-noticia {
      background: var(--bg-card);
      border: 1px solid var(--borda);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      backdrop-filter: blur(8px);
    }
    .card-noticia:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
    }
    .card-capa {
      height: 185px;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .card-capa .tag-categoria {
      position: absolute;
      top: 12px;
      left: 12px;
      margin: 0;
    }
    .card-conteudo {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-conteudo h3 {
      margin: 0 0 10px;
      font-size: 1.15rem;
      line-height: 1.35;
    }
    .card-conteudo p {
      margin: 0 0 16px;
      color: var(--texto-sec);
      font-size: 0.92rem;
      line-height: 1.5;
      flex: 1;
    }
    .card-rodape {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--borda);
    }
    .card-acoes {
      display: flex;
      gap: 6px;
    }
    .btn-icone {
      background: rgba(128, 128, 128, 0.16);
      color: var(--texto);
      border: 1px solid var(--borda);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-icone.salvo {
      background: rgba(229, 184, 75, 0.22);
      border-color: var(--dourado);
    }

    /* Modais e Painel */
    .modal-fundo {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 18px;
      z-index: 30;
    }
    .modal-fundo.aberto { display: flex; }
    .modal-caixa {
      background: var(--bg-card-solido);
      color: var(--texto);
      border: 1px solid var(--borda);
      border-top: 5px solid var(--vermelho);
      border-radius: 16px;
      max-width: 760px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .modal-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .modal-img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .modal-texto p {
      line-height: 1.7;
      font-size: 1.02rem;
      margin: 0 0 14px;
    }

    /* Formulário de nova notícia */
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-grid label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .form-grid input, .form-grid select, .form-grid textarea {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--borda);
      background: rgba(128, 128, 128, 0.12);
      color: var(--texto);
      font-family: inherit;
      font-size: 0.95rem;
    }

    /* Painel de salvos */
    #painel-salvos {
      position: fixed;
      top: 0;
      right: -420px;
      width: 390px;
      max-width: 92%;
      height: 100%;
      background: var(--bg-card-solido);
      color: var(--texto);
      border-left: 3px solid var(--vermelho);
      padding: 20px;
      overflow-y: auto;
      transition: right 0.3s ease;
      z-index: 35;
      box-shadow: -6px 0 24px rgba(0, 0, 0, 0.5);
    }
    #painel-salvos.aberto { right: 0; }
    .item-salvo {
      padding: 12px;
      border: 1px solid var(--borda);
      border-radius: 10px;
      margin-bottom: 10px;
      background: rgba(128, 128, 128, 0.08);
    }

    #toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #111;
      color: #fff;
      border: 1px solid var(--vermelho);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 50;
    }
    #toast.mostrar {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #d0d0d8;
      font-size: 0.85rem;
      background: rgba(10, 10, 12, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <!-- Camadas do slideshow de fundo (troca a cada 3 segundos) -->
  <div class="fundo-slide ativo" id="slide1"></div>
  <div class="fundo-slide" id="slide2"></div>
  <div id="camada-escura"></div>

  <header>
    <div class="topo-container">
      <div class="marca">
        <div class="escudo-badge">CRF</div>
        <div>
          <h1>Nação Rubro-Negra</h1>
          <span>Portal de Notícias, Jogos e Bastidores do Flamengo</span>
        </div>
      </div>
      <div class="acoes-topo">
        <button class="btn" id="btn-tema" type="button">☀️ Tema Claro</button>
        <button class="btn" id="btn-abrir-salvos" type="button">🔖 Salvos (<span id="qtd-salvos">0</span>)</button>
        <button class="btn btn-vermelho" id="btn-nova-noticia" type="button">+ Publicar Notícia</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Notícia em Destaque -->
    <section class="destaque" id="area-destaque"></section>

    <!-- Filtros e Busca -->
    <section class="barra-navegacao">
      <div class="categorias" id="lista-categorias">
        <button class="cat-btn ativa" data-cat="Todas" type="button">Todas</button>
        <button class="cat-btn" data-cat="Jogos" type="button">Jogos</button>
        <button class="cat-btn" data-cat="Mercado da Bola" type="button">Mercado da Bola</button>
        <button class="cat-btn" data-cat="Bastidores" type="button">Bastidores</button>
        <button class="cat-btn" data-cat="Base" type="button">Base</button>
      </div>
      <div class="campo-busca">
        <input type="search" id="input-busca" placeholder="Buscar notícia do Mengão...">
      </div>
    </section>

    <!-- Lista de Notícias -->
    <section class="grid-noticias" id="grid-noticias"></section>
  </main>

  <footer>
    Nação Rubro-Negra • Blog independente de notícias sobre o Clube de Regatas do Flamengo
  </footer>

  <!-- Modal de Leitura do Artigo -->
  <div class="modal-fundo" id="modal-leitura" role="dialog" aria-modal="true">
    <div class="modal-caixa">
      <div class="modal-topo">
        <span class="tag-categoria" id="leitura-categoria"></span>
        <button class="btn-icone" id="btn-fechar-leitura" type="button">Fechar ✕</button>
      </div>
      <h2 id="leitura-titulo" style="margin-top:0;"></h2>
      <div class="meta-info" id="leitura-meta"></div>
      <img class="modal-img" id="leitura-imagem" src="" alt="Imagem da notícia">
      <div class="modal-texto" id="leitura-conteudo"></div>
      <div style="display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;">
        <button class="btn btn-vermelho" id="btn-leitura-salvar" type="button">🔖 Salvar notícia</button>
        <button class="btn-icone" id="btn-leitura-compartilhar" type="button">📋 Copiar resumo</button>
      </div>
    </div>
  </div>

  <!-- Modal para Publicar Nova Notícia -->
  <div class="modal-fundo" id="modal-publicar" role="dialog" aria-modal="true">
    <div class="modal-caixa" style="max-width:560px;">
      <div class="modal-topo">
        <h3 style="margin:0;">Nova Notícia do Flamengo</h3>
        <button class="btn-icone" id="btn-fechar-publicar" type="button">Fechar ✕</button>
      </div>
      <form class="form-grid" id="form-noticia">
        <label>Título da notícia
          <input type="text" id="novo-titulo" required placeholder="Ex.: Maracanã lotado para a próxima decisão">
        </label>
        <label>Categoria
          <select id="nova-categoria">
            <option value="Jogos">Jogos</option>
            <option value="Mercado da Bola">Mercado da Bola</option>
            <option value="Bastidores">Bastidores</option>
            <option value="Base">Base</option>
          </select>
        </label>
        <label>Resumo curto
          <input type="text" id="novo-resumo" required placeholder="Resumo exibido no card principal">
        </label>
        <label>Texto completo
          <textarea id="novo-texto" rows="5" required placeholder="Escreva os parágrafos da notícia..."></textarea>
        </label>
        <label>Link da imagem (opcional)
          <input type="url" id="nova-imagem" placeholder="https://...">
        </label>
        <button class="btn btn-vermelho" type="submit">Publicar no Blog</button>
      </form>
    </div>
  </div>

  <!-- Painel Lateral de Notícias Salvas -->
  <aside id="painel-salvos">
    <div class="modal-topo">
      <h3 style="margin:0;">🔖 Notícias Salvas</h3>
      <button class="btn-icone" id="btn-fechar-salvos" type="button">Fechar ✕</button>
    </div>
    <div id="lista-salvos"></div>
  </aside>

  <div id="toast"></div>

  <script>
    // Imagens de fundo (estádio, torcida e clima rubro-negro)
    // Dica: você pode trocar qualquer link abaixo por fotos oficiais ou suas próprias imagens
    const imagensFundo = [
      "https://images.unsplash.com/photo-1518091043644-c1d4457512c6?w=1920&q=80",
      "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1920&q=80",
      "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1920&q=80",
      "https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=1920&q=80",
      "https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=1920&q=80"
    ];

    const slides = [document.getElementById("slide1"), document.getElementById("slide2")];
    let indiceImagem = 0;
    let slideVisivel = 0;

    function iniciarSlideshowFundo() {
      slides[0].style.backgroundImage = `url('${imagensFundo[0]}')`;
      setInterval(() => {
        indiceImagem = (indiceImagem + 1) % imagensFundo.length;
        const proximoSlide = 1 - slideVisivel;
        const urlProxima = imagensFundo[indiceImagem];

        const imgPreload = new Image();
        imgPreload.onload = imgPreload.onerror = () => {
          slides[proximoSlide].style.backgroundImage = `url('${urlProxima}')`;
          slides[proximoSlide].classList.add("ativo");
          slides[slideVisivel].classList.remove("ativo");
          slideVisivel = proximoSlide;
        };
        imgPreload.src = urlProxima;
      }, 3000); // Troca a cada 3 segundos
    }

    // Notícias iniciais do blog
    const noticiasIniciais = [
      {
        id: "fla-1",
        destaque: true,
        titulo: "Ninho do Urubu tem treino intenso com foco em bola parada e pressão alta",
        categoria: "Bastidores",
        data: "Hoje • 14:30",
        autor: "Redação Rubro-Negra",
        imagem: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1200&q=80",
        resumo: "Comissão técnica ajusta posicionamento defensivo e transições rápidas antes da próxima partida decisiva no Maracanã.",
        conteudo: [
          "O elenco do Flamengo realizou nesta tarde mais uma atividade intensa no Ninho do Urubu visando o próximo compromisso da temporada. A comissão técnica priorizou exercícios de saída de bola sob pressão e organização nas jogadas ensaiadas.",
          "Durante a segunda parte do treinamento, os jogadores participaram de um trabalho tático em campo reduzido para acelerar a troca de passes no último terço do gramado.",
          "A expectativa é de casa cheia no Maracanã, com a Nação preparando uma grande festa nas arquibancadas para empurrar o time desde o apito inicial."
        ]
      },
      {
        id: "fla-2",
        titulo: "Maracanã promete clima de decisão com mais de 60 mil ingressos emitidos",
        categoria: "Jogos",
        data: "Hoje • 11:15",
        autor: "Setorista Maracanã",
        imagem: "https://images.unsplash.com/photo-1518091043644-c1d4457512c6?w=1200&q=80",
        resumo: "Setores Norte e Leste já estão esgotados; torcida organiza mosaico especial para a entrada da equipe.",
        conteudo: [
          "A Nação Rubro-Negra mais uma vez mostra sua força fora das quatro linhas. A parcial mais recente confirma mais de 60 mil bilhetes garantidos para o duelo no Maracanã.",
          "Os portões do estádio serão abertos três horas antes da partida, e a recomendação do clube é que os torcedores cheguem cedo para evitar filas nos acessos.",
          "Nas redes sociais, movimentos de torcedores mobilizam o público para levantar o mosaico rubro-negro assim que o hino começar a tocar."
        ]
      },
      {
        id: "fla-3",
        titulo: "Diretoria avalia nomes para reforçar o meio-campo na próxima janela",
        categoria: "Mercado da Bola",
        data: "Ontem • 19:40",
        autor: "Plantão Mercado",
        imagem: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1200&q=80",
        resumo: "Departamento de futebol mapeia atletas com perfil de intensidade e boa chegada à área para encorpar o elenco.",
        conteudo: [
          "De olho na sequência de competições simultâneas, o departamento de futebol do Flamengo mantém ativo o monitoramento de mercado para possíveis reforços pontuais.",
          "O foco principal está em jogadores com boa capacidade de recomposição e passe vertical, características consideradas essenciais para manter o ritmo ao longo da temporada.",
          "Qualquer avanço oficial só deve ocorrer após o alinhamento financeiro e técnico entre diretoria e comissão."
        ]
      },
      {
        id: "fla-4",
        titulo: "Garotos do Ninho ganham espaço nos treinos entre os profissionais",
        categoria: "Base",
        data: "Ontem • 16:05",
        autor: "Cobertura Base",
        imagem: "https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=1200&q=80",
        resumo: "Jovens destaques do Sub-20 participam da preparação semanal e chamam atenção pela personalidade.",
        conteudo: [
          "Mantendo a tradição formadora do clube, quatro atletas das categorias de base foram integrados às atividades do elenco principal no Ninho do Urubu.",
          "Os jovens passaram por avaliações físicas e participaram normalmente do coletivo, recebendo orientações constantes dos jogadores mais experientes do grupo.",
          "A integração facilita a transição para o time de cima e oferece novas alternativas de velocidade e fôlego para o banco de reservas."
        ]
      },
      {
        id: "fla-5",
        titulo: "Análise tática: como o Flamengo tem explorado os corredores laterais",
        categoria: "Jogos",
        data: "23 Nov • 21:00",
        autor: "Coluna Tática",
        imagem: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=1200&q=80",
        resumo: "Ultrapassagens dos laterais e triangulações pelas pontas aumentaram o volume ofensivo da equipe nas últimas rodadas.",
        conteudo: [
          "Um dos pontos altos das últimas atuações do Flamengo tem sido a coordenação entre pontas e laterais na construção das jogadas ofensivas.",
          "Quando o adversário fecha o corredor central, a equipe acelera a inversão de bola para criar situações de superioridade numérica pelos lados.",
          "Esse movimento também abre espaço na entrada da área para finalizações de média distância dos meias que chegam de trás."
        ]
      }
    ];

    let categoriaAtual = "Todas";
    let termoBusca = "";
    let noticiaAbertaId = null;

    function lerNoticiasExtras() {
      try {
        return JSON.parse(localStorage.getItem("fla_noticias_extras") || "[]");
      } catch {
        return [];
      }
    }

    function todasNoticias() {
      return [...lerNoticiasExtras(), ...noticiasIniciais];
    }

    function lerSalvos() {
      try {
        return JSON.parse(localStorage.getItem("fla_noticias_salvas") || "[]");
      } catch {
        return [];
      }
    }

    function salvarListaSalvos(ids) {
      localStorage.setItem("fla_noticias_salvas", JSON.stringify(ids));
      document.getElementById("qtd-salvos").textContent = ids.length;
    }

    function alternarSalvo(id) {
      const salvos = lerSalvos();
      const idx = salvos.indexOf(id);
      if (idx >= 0) {
        salvos.splice(idx, 1);
        mostrarToast("Notícia removida dos salvos");
      } else {
        salvos.push(id);
        mostrarToast("Notícia salva para ler depois! 🔖");
      }
      salvarListaSalvos(salvos);
      renderizarTudo();
    }

    function tempoLeitura(noticia) {
      const palavras = noticia.conteudo.join(" ").split(/\s+/).length;
      const minutos = Math.max(1, Math.ceil(palavras / 180));
      return `${minutos} min de leitura`;
    }

    function mostrarToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("mostrar");
      clearTimeout(mostrarToast._t);
      mostrarToast._t = setTimeout(() => toast.classList.remove("mostrar"), 2400);
    }

    function renderizarDestaque() {
      const lista = todasNoticias();
      const destaque = lista.find(n => n.destaque) || lista[0];
      const area = document.getElementById("area-destaque");
      if (!destaque) {
        area.style.display = "none";
        return;
      }
      area.style.display = "grid";
      area.innerHTML = `
        <div class="destaque-img" style="background-image:url('${destaque.imagem}')"></div>
        <div class="destaque-corpo">
          <span class="tag-categoria">🔥 Destaque • ${destaque.categoria}</span>
          <h2>${destaque.titulo}</h2>
          <div class="meta-info">${destaque.data} • ${destaque.autor} • ${tempoLeitura(destaque)}</div>
          <p>${destaque.resumo}</p>
          <div>
            <button class="btn btn-vermelho" type="button" onclick="abrirLeitura('${destaque.id}')">Ler matéria completa</button>
          </div>
        </div>
      `;
    }

    function renderizarGrid() {
      const grid = document.getElementById("grid-noticias");
      const salvos = lerSalvos();
      const filtradas = todasNoticias().filter(n => {
        const bateCategoria = categoriaAtual === "Todas" || n.categoria === categoriaAtual;
        const textoCompleto = (n.titulo + " " + n.resumo + " " + n.categoria).toLowerCase();
        const bateBusca = !termoBusca || textoCompleto.includes(termoBusca.toLowerCase());
        return bateCategoria && bateBusca;
      });

      if (!filtradas.length) {
        grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; background:var(--bg-card); padding:24px; border-radius:12px;">Nenhuma notícia encontrada para esse filtro.</p>`;
        return;
      }

      grid.innerHTML = filtradas.map(n => {
        const estaSalva = salvos.includes(n.id);
        return `
          <article class="card-noticia">
            <div class="card-capa" style="background-image:url('${n.imagem}')">
              <span class="tag-categoria">${n.categoria}</span>
            </div>
            <div class="card-conteudo">
              <div class="meta-info" style="margin-bottom:8px;">${n.data} • ${tempoLeitura(n)}</div>
              <h3>${n.titulo}</h3>
              <p>${n.resumo}</p>
              <div class="card-rodape">
                <button class="btn btn-vermelho" style="padding:7px 12px; font-size:0.84rem;" type="button" onclick="abrirLeitura('${n.id}')">Ler mais</button>
                <div class="card-acoes">
                  <button class="btn-icone ${estaSalva ? "salvo" : ""}" type="button" title="Salvar notícia" onclick="alternarSalvo('${n.id}')">
                    ${estaSalva ? "🔖 Salvo" : "🔖"}
                  </button>
                  <button class="btn-icone" type="button" title="Copiar notícia" onclick="copiarNoticia('${n.id}')">📋</button>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderizarPainelSalvos() {
      const container = document.getElementById("lista-salvos");
      const salvos = lerSalvos();
      const noticias = todasNoticias().filter(n => salvos.includes(n.id));
      document.getElementById("qtd-salvos").textContent = noticias.length;

      if (!noticias.length) {
        container.innerHTML = `<p style="color:var(--texto-sec);">Você ainda não salvou nenhuma notícia do Mengão.</p>`;
        return;
      }

      container.innerHTML = noticias.map(n => `
        <div class="item-salvo">
          <small style="color:var(--vermelho); font-weight:700;">${n.categoria} • ${n.data}</small>
          <h4 style="margin:6px 0 10px;">${n.titulo}</h4>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-vermelho" style="padding:6px 10px; font-size:0.8rem;" type="button" onclick="abrirLeitura('${n.id}')">Ler</button>
            <button class="btn-icone" type="button" onclick="alternarSalvo('${n.id}')">Remover</button>
          </div>
        </div>
      `).join("");
    }

    function abrirLeitura(id) {
      const noticia = todasNoticias().find(n => n.id === id);
      if (!noticia) return;
      noticiaAbertaId = id;
      document.getElementById("leitura-categoria").textContent = noticia.categoria;
      document.getElementById("leitura-titulo").textContent = noticia.titulo;
      document.getElementById("leitura-meta").textContent = `${noticia.data} • Por ${noticia.autor} • ${tempoLeitura(noticia)}`;
      document.getElementById("leitura-imagem").src = noticia.imagem;
      document.getElementById("leitura-conteudo").innerHTML = noticia.conteudo.map(p => `<p>${p}</p>`).join("");
      document.getElementById("modal-leitura").classList.add("aberto");
    }

    function copiarNoticia(id) {
      const noticia = todasNoticias().find(n => n.id === id);
      if (!noticia) return;
      const texto = `🔴⚫ ${noticia.titulo}\n${noticia.resumo}\n— Via Nação Rubro-Negra`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(texto).then(() => mostrarToast("Notícia copiada para compartilhar! 📋"));
      }
    }

    function renderizarTudo() {
      renderizarDestaque();
      renderizarGrid();
      renderizarPainelSalvos();
    }

    // Eventos de categorias e busca
    document.getElementById("lista-categorias").addEventListener("click", e => {
      const btn = e.target.closest(".cat-btn");
      if (!btn) return;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("ativa"));
      btn.classList.add("ativa");
      categoriaAtual = btn.dataset.cat;
      renderizarGrid();
    });

    document.getElementById("input-busca").addEventListener("input", e => {
      termoBusca = e.target.value.trim();
      renderizarGrid();
    });

    // Tema claro/escuro
    const btnTema = document.getElementById("btn-tema");
    btnTema.onclick = () => {
      document.body.classList.toggle("tema-claro");
      const claro = document.body.classList.contains("tema-claro");
      btnTema.textContent = claro ? "🌙 Tema Escuro" : "☀️ Tema Claro";
    };

    // Modais e Painel
    document.getElementById("btn-fechar-leitura").onclick = () => document.getElementById("modal-leitura").classList.remove("aberto");
    document.getElementById("btn-leitura-salvar").onclick = () => { if (noticiaAbertaId) alternarSalvo(noticiaAbertaId); };
    document.getElementById("btn-leitura-compartilhar").onclick = () => { if (noticiaAbertaId) copiarNoticia(noticiaAbertaId); };

    document.getElementById("btn-nova-noticia").onclick = () => document.getElementById("modal-publicar").classList.add("aberto");
    document.getElementById("btn-fechar-publicar").onclick = () => document.getElementById("modal-publicar").classList.remove("aberto");

    document.getElementById("btn-abrir-salvos").onclick = () => document.getElementById("painel-salvos").classList.add("aberto");
    document.getElementById("btn-fechar-salvos").onclick = () => document.getElementById("painel-salvos").classList.remove("aberto");

    // Publicar nova notícia direto no navegador
    document.getElementById("form-noticia").addEventListener("submit", e => {
      e.preventDefault();
      const titulo = document.getElementById("novo-titulo").value.trim();
      const categoria = document.getElementById("nova-categoria").value;
      const resumo = document.getElementById("novo-resumo").value.trim();
      const textoBruto = document.getElementById("novo-texto").value.trim();
      const imgUrl = document.getElementById("nova-imagem").value.trim() || imagensFundo[0];

      const nova = {
        id: "user-" + Date.now(),
        titulo,
        categoria,
        data: "Agora mesmo",
        autor: "Editor Rubro-Negro",
        imagem: imgUrl,
        resumo,
        conteudo: textoBruto.split(/\n+/).filter(Boolean)
      };

      const extras = lerNoticiasExtras();
      extras.unshift(nova);
      localStorage.setItem("fla_noticias_extras", JSON.stringify(extras));

      e.target.reset();
      document.getElementById("modal-publicar").classList.remove("aberto");
      renderizarTudo();
      mostrarToast("Notícia publicada com sucesso! 🔴⚫");
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        document.getElementById("modal-leitura").classList.remove("aberto");
        document.getElementById("modal-publicar").classList.remove("aberto");
        document.getElementById("painel-salvos").classList.remove("aberto");
      }
    });

    iniciarSlideshowFundo();
    renderizarTudo();
  </script>
</body>
</html>
